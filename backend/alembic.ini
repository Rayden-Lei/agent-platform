# Alembic 配置（2026-11-18 接入，docs/09 第三梯队「Alembic」）。
#
# 为什么 ini 里没有 sqlalchemy.url
# ---------------------------------
# 连接串只在 app/config.py 的 DATABASE_URL 维护一份。这里再写一份就有两个真相：
# 改了 .env 忘了 ini 时，alembic 会连到另一个库 —— 最坏的情况是在错的库上执行 upgrade。
# 口令也不该出现在会被提交的文件里。env.py 直接读 settings.DATABASE_URL 建 engine，不经过 ini。
#
# 环境切换与后端、pytest 同一套：默认读 backend/.env；开发机用 ENV_FILE=.env.local 切到隧道那份。
# 命令都在 backend 目录执行：
#   ENV_FILE=.env.local .venv/bin/alembic current -v          # 当前库在哪个版本
#   ENV_FILE=.env.local .venv/bin/alembic history             # 有哪些版本
#   ENV_FILE=.env.local .venv/bin/alembic revision --autogenerate -m "add_xxx_column"
#   ENV_FILE=.env.local .venv/bin/alembic upgrade head        # 升级到最新
#   ENV_FILE=.env.local .venv/bin/alembic check               # 只比对、不写库：模型与库是否有漂移

[alembic]
script_location = %(here)s/alembic
# 让 app 包可导入：用 %(here)s（ini 所在目录）而不是 .，这样从仓库根目录用 -c 指定 ini 也能跑
prepend_sys_path = %(here)s
path_separator = os

# 生成的文件名沿用项目既有习惯：日期时间前缀 + revision + slug，
# 与 scripts/migrations/ 里的历史脚本一眼能区分（那边是 <日期>_<时间>_<随机6位>_<描述>.py）。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# 版本目录默认 <script_location>/versions，不另配 version_locations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
