server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 与后端 KB_UPLOAD_MAX_MB 同值：nginx 默认只放 1MB，超出直接 413，后端的上限形同虚设
    client_max_body_size 200m;

    # 防点击劫持（docs/15 PB-07）：管理台只许同源嵌入；分享页 /s/ 另放行 EMBED_ALLOWED_ORIGINS（空格分隔的来源）。
    # 本文件是模板（Dockerfile 放进 /etc/nginx/templates/），容器启动时由官方镜像用 envsubst 替换这个变量；
    # 镜像里给了空的默认值 —— 变量没定义时它会原样留下，nginx 当成未知变量直接起不来。
    location /s/ {
        add_header Content-Security-Policy "frame-ancestors 'self' ${EMBED_ALLOWED_ORIGINS}" always;
        try_files $uri /index.html;
    }

    location / {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 后端（TRUSTED_PROXY_ENABLED 打开时）先信 X-Real-IP：这里用连接对端覆写，客户端自带的伪造不了
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
