name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run tests
        run: cd backend && PYTHONPATH=. python3 -m pytest tests/ -v
        env:
          DATABASE_URL: postgresql+psycopg2://admin:postgres@localhost:5432/agent_platform
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
          AES_KEY: ci-test-aes-key
          # 测试默认关闭入口限流（与 tests/conftest.py 一致）；限流用例自行用 monkeypatch 打开
          RATE_LIMIT_ENABLED: "false"
          # CI 是空库：应用启动时按 INITIAL_ADMIN_PASSWORD 建 admin。不能用内置默认口令 ——
          # 那样 admin 会被置为"必须改密"，除改密外全部 403（docs/15 OP-04）。本地连共享开发库时口令写在 backend/.env
          INITIAL_ADMIN_PASSWORD: ci-admin-pass-0001
          TEST_ADMIN_PASSWORD: ci-admin-pass-0001

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Type check
        run: cd frontend && npx tsc --noEmit
      - name: Build
        run: cd frontend && npm run build